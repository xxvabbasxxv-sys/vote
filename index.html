<title>Elite State | التصويت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070a; --panel:#0c121a; --panel2:#111925;
    --primary:#9bd9ff; --gold:#c9a24b; --light:#eaf6ff;
    --text:#e9f1f8; --muted:#7c8ca0;
    --border:rgba(155,217,255,.16); --border-strong:rgba(155,217,255,.34);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(60% 420px at 50% -80px, rgba(234,246,255,.16), transparent 70%),
      radial-gradient(40% 300px at 85% 0, rgba(155,217,255,.10), transparent 70%),
      var(--bg);
    color:var(--text); font-family:'Tajawal',sans-serif; line-height:1.75; min-height:100vh;
  }
  main{position:relative; max-width:720px; margin:0 auto; padding:56px 20px 90px;}
  .brand{display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:34px;}
  .brand img{width:52px; height:52px; border-radius:50%; object-fit:cover; border:2px solid var(--border-strong);}
  .brand b{font-size:20px; font-weight:900; letter-spacing:2px; color:var(--light);}
  h1{font-size:clamp(30px,6vw,46px); font-weight:900; text-align:center; color:var(--light); text-shadow:0 0 36px rgba(234,246,255,.25);}
  .sub{text-align:center; color:var(--muted); margin:10px 0 40px;}
  .poll{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border); border-top:1px solid rgba(234,246,255,.45);
    border-radius:16px; padding:26px 24px 20px; margin-bottom:22px;
  }
  .poll h2{font-size:19px; font-weight:800; margin-bottom:18px;}
  .opts{display:flex; flex-direction:column; gap:10px;}
  .opt{
    position:relative; overflow:hidden; display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; padding:14px 18px; border-radius:11px; font:inherit; font-weight:700; font-size:15px; text-align:right;
    background:var(--bg); color:var(--text); border:1px solid var(--border);
  }
  button.opt{cursor:pointer; transition:border-color .15s, background .15s;}
  button.opt:hover{border-color:var(--primary);}
  button.opt.on{border-color:var(--light); background:rgba(234,246,255,.10); color:var(--light);}
  .opt span,.opt b{position:relative; z-index:1;}
  .res i{position:absolute; inset:0 auto 0 0; background:rgba(155,217,255,.16); transition:width .6s ease;}
  .res.mine{border-color:var(--light);}
  .res.mine i{background:linear-gradient(90deg,rgba(201,162,75,.30),rgba(234,246,255,.38));}
  .res b{color:var(--primary); font-variant-numeric:tabular-nums;}
  .res.mine b{color:var(--light);}
  .foot{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; color:var(--muted); font-size:13px;}
  .go{
    font:inherit; font-weight:800; font-size:14px; padding:10px 26px; border-radius:10px; cursor:pointer;
    background:linear-gradient(180deg,var(--light),var(--primary)); color:#05070a; border:0;
  }
  .go:disabled{opacity:.35; cursor:not-allowed;}
  .timer{margin:0 0 20px; padding:14px; border:1px solid var(--border); border-radius:12px; background:rgba(234,246,255,.04);}
  .tu{display:flex; gap:10px;}
  .tu div{flex:1; text-align:center; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:8px 4px;}
  .tu b{display:block; font-size:24px; font-weight:900; color:var(--light); font-variant-numeric:tabular-nums; line-height:1.4;}
  .tu small{color:var(--muted); font-size:12px;}
  .te{display:block; margin-top:10px; font-size:12.5px; color:var(--gold); text-align:center;}
  .tag{color:var(--gold); font-weight:700;}
  em{font-style:normal; font-size:12px; color:var(--gold); margin-inline-start:8px;}
  .msg{border:1px dashed var(--border-strong); border-radius:12px; padding:16px 20px; text-align:center; color:var(--muted);}
  /* ---- اليدين والحبتين ---- */
  .pills{display:flex; justify-content:center; gap:30px; margin:-8px 0 34px; pointer-events:none;}
  .hand{--c:#b06bff; width:112px; text-align:center;}
  .hand.blue{--c:#5ccfff;}
  .hname{font-size:26px; font-weight:900; letter-spacing:.12em; color:var(--c); text-shadow:0 0 18px var(--c); line-height:1.2; margin-bottom:6px; transition:color .8s ease, text-shadow .8s ease;}
  .hsvg{width:100%; display:block; -webkit-mask-image:linear-gradient(#000 70%, transparent); mask-image:linear-gradient(#000 70%, transparent);}
  .hand.blue .hsvg{transform:scaleX(-1);}
  .g-fill{fill:var(--c); fill-opacity:.13;}
  .g-shine{fill:url(#glassShine);}
  .g-line{fill:none; stroke:var(--c); stroke-width:1.4; stroke-linecap:round; opacity:.5;}
  .g-edge{fill:none; stroke:var(--c); stroke-width:2.4; stroke-linejoin:round;}
  .hsvg{opacity:.5; filter:grayscale(.8) drop-shadow(0 0 0 transparent); transition:opacity .8s ease, filter .8s ease;}
  .bob{filter:drop-shadow(0 0 0 transparent); transition:filter .8s ease;}
  .hand.lit .hsvg{opacity:1; filter:grayscale(0) drop-shadow(0 0 9px var(--c));}
  .hand.lit .bob{filter:drop-shadow(0 0 7px var(--c));}
  .hand:not(.lit) .hname{color:var(--muted); text-shadow:none;}
  .pill-body{fill:var(--c);}
  .bob{animation:bob 4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);}}
  @media (min-width:1180px){
    .pills{display:block; height:0; margin:0;}
    .hand{position:absolute; top:230px; width:190px;}
    .hand.purple{left:calc(100% + 28px);}
    .hand.blue{right:calc(100% + 28px);}
    .hname{font-size:36px;}
  }
  .tally{position:absolute; top:16px; left:16px; z-index:5; display:flex; gap:8px;}
  .tally div{min-width:66px; text-align:center; padding:6px 12px; border:1px solid var(--border-strong); border-radius:11px; background:rgba(12,18,26,.82); backdrop-filter:blur(6px);}
  .tally b{display:block; font-size:22px; font-weight:900; line-height:1.3; font-variant-numeric:tabular-nums;}
  .tally span{font-size:12px; color:var(--muted); font-weight:700;}
  .tally .t-yes{border-color:rgba(176,107,255,.55);}
  .tally .t-yes b{color:#c28bff;}
  .tally .t-no{border-color:rgba(92,207,255,.55);}
  .tally .t-no b{color:#5ccfff;}
  @media (max-width:640px){ .tally{position:static; justify-content:center; padding-top:14px;} }
  :root{--p:.4;}
  /* صور الجانبين: اليسار Elite State يخفت مع الوقت، واليمين Respect Club يتضح مع اقتراب النهاية */
  .art{position:fixed; top:0; bottom:0; width:50%; z-index:0; pointer-events:none; overflow:hidden;}
  .art-l{left:0;} .art-r{right:0;}
  .art .bg{position:absolute; inset:0; background-size:cover; background-position:center;}
  .art-l .bg{background-image:url(assets/el-banner.webp); opacity:calc(.36 - .2 * var(--p));
    -webkit-mask-image:linear-gradient(to right,#000 35%,transparent 100%); mask-image:linear-gradient(to right,#000 35%,transparent 100%);}
  .art-r .bg{background-image:url(assets/rc-city.webp); opacity:calc(.2 + .32 * var(--p)); filter:blur(calc(14px * (1 - var(--p))));
    -webkit-mask-image:linear-gradient(to left,#000 35%,transparent 100%); mask-image:linear-gradient(to left,#000 35%,transparent 100%);}
  .art img{position:absolute; height:auto; -webkit-mask-image:radial-gradient(ellipse at center,#000 58%,transparent 100%); mask-image:radial-gradient(ellipse at center,#000 58%,transparent 100%);}
  .art-l img{opacity:calc(var(--o) * (1 - .5 * var(--p)));}
  .art-r img{opacity:calc(var(--o) * (.55 + .45 * var(--p))); filter:blur(calc(7px * (1 - var(--p))));}
  .art-l .medal{--o:.55; left:8%; bottom:150px; width:190px;}
  .art-l .wm{--o:.5; left:24px; bottom:18px; width:210px;}
  .art-r .wel{--o:.45; right:28px; top:76px; width:min(420px,34vw);}
  .art-r .lg{--o:.5; right:8%; bottom:150px; width:230px;}
  .art-r .con{--o:.5; right:28px; bottom:18px; width:min(430px,34vw);}
  .note{width:170px; margin:-8px -29px 0; text-align:center; transition:opacity .8s ease;}
  .hand:not(.lit) .note{opacity:.5;}
  .note b{display:block; font-size:19px; font-weight:900; color:var(--c); text-shadow:0 0 14px var(--c); line-height:1.5;}
  .note span{display:block; font-size:12px; font-weight:800; letter-spacing:.14em; color:var(--muted);}
  .note small{display:block; margin-top:4px; font-size:12px; line-height:1.6; color:var(--muted);}
  .note .bar{height:4px; width:150px; margin:8px auto 4px; border-radius:4px; background:rgba(255,255,255,.1); overflow:hidden;}
  .note .bar i{display:block; height:100%; width:calc(var(--p) * 100%); border-radius:4px; background:linear-gradient(90deg,var(--c),#fff);}
  @media (min-width:1180px){ .note{width:190px; margin:-8px 0 0;} }
  @media (max-width:900px){ .art img{display:none;} }
  #rain{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;}
  :focus-visible{outline:2px solid var(--light); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>

</main>

<script>
  let polls = [], state = {}, failed = false, failCode = '', offset = 0, bestRtt = Infinity;
  const now = () => Date.now() + offset;
  const unitsHtml = ms => {
    const t = Math.max(0, Math.ceil(ms / 1000));
    return [['يوم', Math.floor(t / 86400)], ['ساعة', Math.floor(t % 86400 / 3600)], ['دقيقة', Math.floor(t % 3600 / 60)], ['ثانية', t % 60]]
      .map(([l, n]) => `<div><b>${String(n).padStart(2, '0')}</b><small>${l}</small></div>`).join('');
  };
  const endLabel = iso => new Date(iso).toLocaleString('ar-u-nu-latn', {timeZone: 'Asia/Riyadh', weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit'});
  const timerHtml = p => `<div class="timer" data-end="${p.endsAt}"><div class="tu">${unitsHtml(Date.parse(p.endsAt) - now())}</div><span class="te">ينتهي ${endLabel(p.endsAt)} بتوقيت مكة المكرمة</span></div>`;
  let lastP = -1;
  function artUpdate(){
    const p0 = polls[0];
    if(!p0 || !p0.endsAt) return;
    const end = Date.parse(p0.endsAt), start = p0.startsAt ? Date.parse(p0.startsAt) : end - 5.5 * 864e5, left = end - now();
    const p = p0.closed || left <= 0 ? 1 : Math.round(Math.min(1, Math.max(0, (now() - start) / (end - start))) * 100) / 100;
    if(p !== lastP){ lastP = p; document.documentElement.style.setProperty('--p', p); }
    const msg = (p0.closed || left <= 0) ? 'انتهى التصويت… شكراً لكل صوت'
      : left < 36e5 ? 'دقايق وتنكشف النتيجة…'
      : left < 864e5 ? 'آخر 24 ساعة، كل صوت يفرق'
      : left < 3 * 864e5 ? 'العد التنازلي بدأ… قرّبنا'
      : 'بداية جديدة تقترب بهدوء';
    const el = document.getElementById('tz');
    if(el && el.textContent !== msg) el.textContent = msg;
  }

  function tick(){
    artUpdate();
    document.querySelectorAll('.timer').forEach(el => {
      const left = Date.parse(el.dataset.end) - now();
      if(left <= 0){
        polls.filter(x => x.endsAt === el.dataset.end).forEach(x => x.closed = true);
        render(); refresh();
        return;
      }
      el.querySelector('.tu').innerHTML = unitsHtml(left);
    });
  }
  const box = document.getElementById('polls');

  function card(p){
    const s = state[p.id];
    const total = s ? Object.values(s.counts).reduce((a, b) => a + b, 0) : 0;
    const voted = !!(s && s.mine);
    const rows = p.options.map(o => {
      const data = p.closed ? '' : `data-p="${p.id}" data-o="${o.id}"`;
      if(!voted && !p.closed){
        return `<button class="opt" ${data}><span>${o.label}</span></button>`;
      }
      const c = s ? (s.counts[o.id] || 0) : 0;
      const pct = total ? Math.round(c * 100 / total) : 0;
      const mine = voted && s.mine === o.id;
      const tag = p.closed ? 'div' : 'button';
      return `<${tag} class="opt res ${mine ? 'mine' : ''}" ${data}><i style="width:${pct}%"></i><span>${o.label}${mine ? '<em>صوتك</em>' : ''}</span><b>${pct}%</b></${tag}>`;
    }).join('');
    const foot = p.closed
      ? `<span>${total} صوت</span><span class="tag">انتهى التصويت</span>`
      : voted
        ? `<span>${total} صوت</span><span class="tag">اضغط على أي خيار لتغيير صوتك</span>`
        : `<span>اختر خيارك عشان تشوف النتائج</span>`;
    return `<article class="poll"><h2>${p.question}</h2>${p.endsAt && !p.closed ? timerHtml(p) : ''}<div class="opts">${rows}</div><div class="foot">${foot}</div></article>`;
  }

  let litSide = null;
  function paint(){
    const p = polls[0], s = p && state[p.id];
    litSide = (s && s.mine) || null;
    const hp = document.querySelector('.hand.purple'), hb = document.querySelector('.hand.blue');
    if(hp) hp.classList.toggle('lit', litSide === 'yes');
    if(hb) hb.classList.toggle('lit', litSide === 'no');
  }

  function tally(){
    const p = polls[0], s = p && state[p.id];
    document.getElementById('tally').innerHTML = p
      ? p.options.map(o => `<div class="t-${o.id}" title="${o.label}"><b>${s ? (s.counts[o.id] || 0) : '–'}</b><span>${o.short || o.label}</span></div>`).join('')
      : '';
  }

  function render(){
    tally();
    paint();
    if(!polls.length){
      box.innerHTML = failed
        ? `<div class="msg">التصويت متوقف مؤقتاً، جرّب بعد شوي.<br><small>رمز الخطأ: ${failCode}</small></div>`
        : '<div class="msg">جارِ التحميل…</div>';
      return;
    }
    box.innerHTML = polls.map(card).join('');
  }

  async function refresh(){
    try{
      const t0 = Date.now();
      const r = await fetch('/api/vote', {cache: 'no-store'});
      if(!r.ok) throw new Error(r.status);
      const d = await r.json();
      const t1 = Date.now();
      if(d.now && (t1 - t0) <= bestRtt * 1.25 + 40){
        bestRtt = Math.min(bestRtt, t1 - t0);
        offset = d.now - (t0 + t1) / 2;
      }
      polls = d.polls;
      d.results.forEach(s => state[s.id] = s);
      failed = false;
    }catch(e){ failed = true; failCode = e.message || 'network'; }
    render();
  }

  box.addEventListener('click', async e => {
    const o = e.target.closest('[data-o]');
    if(!o) return;
    const id = o.dataset.p, opt = o.dataset.o;
    if(state[id] && state[id].mine === opt) return;
    o.disabled = true;
    try{
      const r = await fetch('/api/vote', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({poll: id, option: opt})
      });
      if(!r.ok) throw new Error(r.status);
      state[id] = await r.json();
      if(state[id].mine !== opt) alert('ما اتغيّر صوتك. غالباً ملف api/vote.js على GitHub قديم، حدّثه.');
    }catch(err){ alert('ما انحسب صوتك، حاول مرة ثانية.'); }
    render();
  });

  render();
  refresh();
  setInterval(refresh, 20000);
  (function loop(){
    tick();
    setTimeout(loop, 1000 - (now() % 1000) + 5); // يصحى مع بداية كل ثانية من ساعة الخادم
  })();
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ tick(); refresh(); } });

  // ---- كلمات تتساقط: Elite State يسار / Respect Club يمين، وتتحرك مع الماوس ----
  (function(){
    const cv = document.getElementById('rain');
    const ctx = cv && cv.getContext && cv.getContext('2d');
    if(!ctx) return;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SIDES = [
      {text: 'Elite State', rgb: '92,207,255', half: 0, opt: 'no', k: 0},
      {text: 'Respect Club', rgb: '176,107,255', half: 1, opt: 'yes', k: 0}
    ];
    const mouse = {x: -9999, y: -9999, vx: 0, vy: 0, on: false};
    let W = 0, H = 0, items = [], last = 0;

    function spawn(s, scatter){
      const d = Math.random(), size = 13 + d * 19;
      ctx.font = `800 ${size}px Tajawal, sans-serif`;
      return {
        s, d, size, w: ctx.measureText(s.text).width,
        speed: 16 + d * 40,
        x: (s.half ? W / 2 : 0) + Math.random() * W / 2,
        y: scatter ? Math.random() * H : -size - Math.random() * H * .4,
        sway: Math.random() * 6.28, amp: 4 + Math.random() * 10,
        rot: (Math.random() - .5) * .5,
        ox: 0, oy: 0, vx: 0, vy: 0, orot: 0, vr: 0, hot: 0
      };
    }

    function build(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const per = Math.max(8, Math.min(30, Math.round(W / 60)));
      items = [];
      SIDES.forEach(s => { for(let i = 0; i < per; i++) items.push(spawn(s, true)); });
    }

    function pos(it){ return [it.x + Math.sin(it.sway) * it.amp + it.ox, it.y + it.oy]; }

    function step(dt){
      const R = 90, k = dt * 60;
      SIDES.forEach(s => { s.k += ((litSide === s.opt ? 1 : 0) - s.k) * Math.min(1, dt * 3); });
      items.forEach(it => {
        it.y += it.speed * dt; it.sway += dt * .8;
        const [px, py] = pos(it);
        let hot = 0;
        if(mouse.on){
          const dist = Math.hypot(Math.max(Math.abs(mouse.x - px) - it.w / 2, 0), Math.max(Math.abs(mouse.y - py) - it.size / 2, 0));
          if(dist < R){
            hot = 1 - dist / R;
            const dx = px - mouse.x, dy = py - mouse.y, m = Math.hypot(dx, dy) || 1, push = hot * hot * 5 * k;
            it.vx += dx / m * push + mouse.vx * .03 * hot;
            it.vy += dy / m * push + mouse.vy * .03 * hot;
            it.vr += (dx >= 0 ? 1 : -1) * hot * .012 * k;
          }
        }
        it.hot += (hot - it.hot) * Math.min(1, dt * 8);
        it.vx -= it.ox * .01 * k; it.vy -= it.oy * .01 * k; it.vr -= it.orot * .02 * k;
        const damp = Math.pow(.9, k);
        it.vx *= damp; it.vy *= damp; it.vr *= damp;
        it.ox += it.vx * k; it.oy += it.vy * k; it.orot += it.vr * k;
        if(py > H + 40) Object.assign(it, spawn(it.s, false));
      });
      mouse.vx *= .8; mouse.vy *= .8;
    }

    function draw(){
      ctx.clearRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      items.forEach(it => {
        const [px, py] = pos(it);
        const edge = Math.max(0, Math.min(1, py / 90, (H - py) / 90));
        const lit = it.s.k;
        const a = ((.10 + it.d * .30) * (.3 + .7 * lit) + it.hot * .45) * edge;
        if(a <= .01) return;
        ctx.save();
        ctx.translate(px, py); ctx.rotate(it.rot + it.orot);
        ctx.font = `800 ${it.size}px Tajawal, sans-serif`;
        ctx.fillStyle = `rgba(${it.s.rgb},${Math.min(a, 1)})`;
        if((it.d > .65 && lit > .5) || it.hot > .2){ ctx.shadowColor = `rgba(${it.s.rgb},.7)`; ctx.shadowBlur = 8 * Math.max(lit, it.hot) + it.hot * 14; }
        ctx.fillText(it.s.text, 0, 0);
        ctx.restore();
      });
    }

    function frame(t){
      const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
      step(dt); draw(); requestAnimationFrame(frame);
    }

    build();
    if(reduce){ draw(); setInterval(() => { SIDES.forEach(s => { s.k = litSide === s.opt ? 1 : 0; }); draw(); }, 800); }
    else requestAnimationFrame(frame);
    window.addEventListener('resize', () => { build(); if(reduce) draw(); });
    window.addEventListener('pointermove', e => {
      mouse.vx = mouse.on ? e.clientX - mouse.x : 0; mouse.vy = mouse.on ? e.clientY - mouse.y : 0;
      mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true;
    });
    document.documentElement.addEventListener('mouseleave', () => { mouse.on = false; });
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { build(); if(reduce) draw(); });
  })();
</script>
